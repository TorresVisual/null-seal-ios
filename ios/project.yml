# XcodeGen spec; the .xcodeproj is generated in CI and never committed.
name: NullSeal
options:
  bundleIdPrefix: app.nullseal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0" # generated UniFFI code is not Swift 6 strict-concurrency clean
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NullSeal:
    type: application
    platform: iOS
    sources: [NullSeal, Generated]
    dependencies:
      - framework: build/CoreUniFFI.xcframework
        embed: false # static library
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nullseal.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        OTHER_LDFLAGS: ["-framework", "Security", "-lresolv"]
