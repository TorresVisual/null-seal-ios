# XcodeGen spec; the .xcodeproj is generated in CI and never committed.
name: NullSeal
options:
  bundleIdPrefix: app.nullseal
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0" # generated UniFFI code is not Swift 6 strict-concurrency clean
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NullSeal:
    type: application
    platform: iOS
    sources: [NullSeal, Generated]
    dependencies:
      - framework: build/CoreUniFFI.xcframework
        embed: false # static library
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nullseal.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the QR code your other device shows to join your vault.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock your vault with Face ID instead of typing the master password.
        OTHER_LDFLAGS: ["-framework", "Security", "-lresolv"]
  NullSealTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NullSealTests]
    dependencies:
      - target: NullSeal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.nullseal.ios.tests
  # Drives the real app against core-uniffi's ui_relay example; screenshots are attachments (#92).
  NullSealUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NullSealUITests]
    dependencies:
      - target: NullSeal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.nullseal.ios.uitests
schemes:
  NullSeal:
    build:
      targets: {NullSeal: all}
    test:
      targets: [NullSealTests, NullSealUITests]
