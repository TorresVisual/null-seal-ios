[package]
name = "core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license-file = "../LICENSE"

[package.metadata]
cargo-fuzz = true

# Own workspace: libFuzzer needs nightly, so this stays out of the main (stable) workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
core-crypto = { path = "../crates/core-crypto" }
core-keys = { path = "../crates/core-keys" }
core-vault = { path = "../crates/core-vault" }
core-import = { path = "../crates/core-import" }
serde_json = "1"

[[bin]]
name = "bitwarden_import"
path = "fuzz_targets/bitwarden_import.rs"
test = false
doc = false

[[bin]]
name = "envelope"
path = "fuzz_targets/envelope.rs"
test = false
doc = false

[[bin]]
name = "payload"
path = "fuzz_targets/payload.rs"
test = false
doc = false

[[bin]]
name = "recovery_code"
path = "fuzz_targets/recovery_code.rs"
test = false
doc = false
