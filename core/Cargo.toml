[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Dependencies (the crypto) are built optimized even in debug builds: the convergence
# simulation (#42) runs thousands of signed, sealed syncs and is ~10x slower otherwise.
[profile.dev.package."*"]
opt-level = 3
