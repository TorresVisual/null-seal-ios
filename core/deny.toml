[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# UniFFI (iOS bindings, #29) is MPL-2.0: file-level copyleft, used unmodified as a dependency.
# Allowed per crate so MPL stays opt-in instead of joining the global allow-list.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_bindgen"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_core"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_internal_macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_meta"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_pipeline"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "uniffi_udl"
