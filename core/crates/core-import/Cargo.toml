[package]
name = "core-import"
description = "Null Seal importers: parse other password managers' exports into vault payloads plus a loss report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
core-crypto = { version = "0.0.0", path = "../core-crypto" }
core-vault = { version = "0.0.0", path = "../core-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9.1"

[dev-dependencies]
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
