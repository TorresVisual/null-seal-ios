[package]
name = "core-crypto"
description = "Null Seal crypto primitives wrapper: AEAD, HKDF, Argon2id, CSPRNG, zeroizing keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = { version = "0.9.4", features = ["zeroize"] }
argon2 = "0.6.0"
base64 = "0.23"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
x25519-dalek = "3"
zeroize = { version = "1.9.1", features = ["derive"] }
