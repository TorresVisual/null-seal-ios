[package]
name = "core-wasm"
description = "Null Seal WASM bindings (wasm-bindgen): non-secret helpers only, see decision #13"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen glue is generated unsafe code, so unsafe_code cannot be `forbid` here.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[features]
# Known-answer tests only (`build:wasm --kat`): never in the shipped extension.
kat = []

[dependencies]
core-crypto = { version = "0.0.0", path = "../core-crypto" }
core-gen = { version = "0.0.0", path = "../core-gen" }
wasm-bindgen = "0.2.130"

# Browser/Node CSPRNG for core-crypto's getrandom; wasm32-unknown-unknown has no default backend.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
